<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Money Manager</title>

<link rel="manifest" href="manifest.json">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Money Manager">

<style>

*{
    box-sizing:border-box;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Arial,sans-serif;
}

body{

    margin:0;
    min-height:100vh;
    background:
    linear-gradient(135deg,#dbeafe,#f5d0fe,#dcfce7);

    padding:20px;

}


.container{

    max-width:600px;
    margin:auto;

}


h1{

    text-align:center;
    font-size:34px;
    color:#111;

}



.glass{

    background:rgba(255,255,255,0.45);

    backdrop-filter:blur(25px);

    -webkit-backdrop-filter:blur(25px);

    border:1px solid rgba(255,255,255,.5);

    border-radius:28px;

    padding:20px;

    margin-top:18px;

    box-shadow:
    0 10px 40px rgba(0,0,0,.12);

}



.cards{

    display:grid;

    grid-template-columns:repeat(3,1fr);

    gap:12px;

}



.card{

    text-align:center;

    padding:15px;

    border-radius:22px;

    background:rgba(255,255,255,.55);

    backdrop-filter:blur(20px);

}



.card h3{

    font-size:14px;

}



.money{

    font-size:22px;

    font-weight:700;

}



input,select,button{

    width:100%;

    padding:15px;

    margin-top:12px;

    border-radius:18px;

    border:none;

    font-size:16px;

}



input,select{

    background:rgba(255,255,255,.7);

}



button{

    background:#111;

    color:white;

    font-weight:700;

}



.purchase{

    background:rgba(255,255,255,.5);

    border-radius:18px;

    padding:12px;

    margin-top:10px;

}



.small{

    color:#555;

    font-size:13px;

}


</style>

</head>


<body>


<div class="container">


<h1>💰 Money Manager</h1>


<div class="glass">


<div class="cards">


<div class="card">

<h3>🍔 Hangout</h3>

<div class="money" id="hangout">65</div>

SAR

</div>


<div class="card">

<h3>💰 Savings</h3>

<div class="money" id="savings">40</div>

SAR

</div>


<div class="card">

<h3>🎮 PS</h3>

<div class="money" id="ps">15</div>

SAR

</div>


</div>

</div>



<div class="glass">


<h2>Add Purchase</h2>


<input id="item" placeholder="What did you buy?">


<input id="cost" type="number" placeholder="Cost SAR">


<select id="type">

<option value="hangout">
🍔 Hangout
</option>

<option value="savings">
💰 Savings
</option>

<option value="ps">
🎮 PlayStation
</option>

</select>


<button onclick="addPurchase()">
Add Purchase
</button>


</div>



<div class="glass">


<h2>History</h2>


<div id="history"></div>


</div>


</div>





<script type="module">


import { initializeApp } 
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


import { getDatabase, ref, set, onValue }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";




// YOUR FIREBASE CONFIG

const firebaseConfig = {

apiKey: "AIzaSyCugS0qHKstXGZArd5vEBzm-DaLZAIDugo",

authDomain: "money-e560a.firebaseapp.com",

databaseURL: "https://money-e560a-default-rtdb.firebaseio.com",

projectId: "money-e560a",

storageBucket: "money-e560a.firebasestorage.app",

messagingSenderId: "477551627159",

appId: "1:477551627159:web:b19f853905331f71ee92d2",

measurementId: "G-YYQD2E5J7J"

};



const app = initializeApp(firebaseConfig);

const db = getDatabase(app);



let money={

hangout:65,

savings:40,

ps:15,

history:[]

};



const user="zezo";



function save(){

set(ref(db,"users/"+user),money);

}




onValue(ref(db,"users/"+user),(snapshot)=>{


if(snapshot.exists()){

money=snapshot.val();

}


update();


});




window.addPurchase=function(){


let name=document.getElementById("item").value;

let cost=
Number(document.getElementById("cost").value);


let type=
document.getElementById("type").value;



if(!name || !cost)return;



if(money[type]<cost){

alert("Not enough money");

return;

}



money[type]-=cost;



money.history.unshift({

name:name,

cost:cost,

type:type,

date:new Date().toLocaleDateString()

});


save();



document.getElementById("item").value="";

document.getElementById("cost").value="";


};



function update(){


document.getElementById("hangout").innerHTML=
money.hangout;


document.getElementById("savings").innerHTML=
money.savings;


document.getElementById("ps").innerHTML=
money.ps;



let h=document.getElementById("history");

h.innerHTML="";


money.history.forEach(p=>{


h.innerHTML+=`

<div class="purchase">

<b>${p.name}</b>

<br>

${p.cost} SAR

<br>

<span class="small">
${p.type} • ${p.date}
</span>

</div>

`;

});


}



if("serviceWorker" in navigator){

navigator.serviceWorker.register("service-worker.js");

}


</script>


</body>

</html>
